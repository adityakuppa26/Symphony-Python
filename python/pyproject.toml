[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-jira"
version = "0.1.0"
description = "Local Jira-driven Symphony orchestrator for Codex CLI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["httpx2>=2.0", "pytest>=8.0"]

[project.scripts]
symphony-jira = "symphony_jira.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["symphony_jira*"]
